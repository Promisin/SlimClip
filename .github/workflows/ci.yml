name: CI (Build & Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-14 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SlimClip.slnx

      - name: Build solution
        run: dotnet build SlimClip.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/SlimClip.Tests/SlimClip.Tests.csproj -c Release --no-build --verbosity normal
