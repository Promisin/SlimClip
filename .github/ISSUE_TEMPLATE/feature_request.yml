name: 功能建议 (Feature request)
description: 为 SlimClip 提出新功能设计、体验优化或交互建议
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您的建议！SlimClip 的核心哲学是**“极简、流畅、纯本地运行”**。我们高度欢迎契合该哲学的轻量化提案。

  - type: textarea
    id: problem
    attributes:
      label: 您遇到了什么问题或痛点？
      description: 现有功能在哪些使用场景下不够便利或存在局限？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 您期望的解决方案或新功能行为
      description: 描述清晰的交互预期与呈现效果
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 您考虑过的其他替代方案
      description: 是否有其他折中或现成的处理方式？
