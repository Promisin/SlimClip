name: 功能建议 (Feature Request)
description: 为 SlimClip 提出新功能建议或交互调优想法
title: "feat: [简短描述功能建议]"
labels: ["needs-triage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢为 SlimClip 提出宝贵建议！我们重视跨平台一致性与轻量流畅体验。
  - type: textarea
    id: problem
    attributes:
      label: 解决的痛点 / 场景背景
      description: 当前遇到了什么不便，或者在什么使用场景下需要该功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案 / 功能设想
      description: 您希望 SlimClip 具备什么样的交互或行为？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有任何替代的变通方案或其它软件的参考实现？
